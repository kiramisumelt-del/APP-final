name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract zip if present
        run: |
          if [ -f "kira's-to-do-list.zip" ]; then
            echo "Extracting project archive..."
            unzip -o "kira's-to-do-list.zip" -d .
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NPM dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Setup Capacitor and Android Platform
        run: |
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli
          npx cap init "Kira's To-Do-List" "com.kira.todolist" --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kiras-To-Do-List-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
