name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract zip if present
        run: |
          if [ -f "kira's-to-do-list.zip" ]; then
            echo "Extracting project archive..."
            unzip -o "kira's-to-do-list.zip" -d .
          fi

      - name: Restore missing utilities and components
        run: |
          mkdir -p src/utils src/components

          # 1. Restore categories.ts
          cat << 'EOF' > src/utils/categories.ts
          import { Category, Priority } from '../types/todo';

          export const DEFAULT_CATEGORIES: Category[] = [
            {
              id: 'personal',
              name: 'Personal',
              icon: '🎀',
              color: '#8A5D6F',
              bgColor: '#F5E7ED',
              borderColor: '#E7D1DA',
            },
            {
              id: 'fits',
              name: 'Fits & Style',
              icon: '✨',
              color: '#5C3854',
              bgColor: '#F2E4ED',
              borderColor: '#E3C8D9',
            },
            {
              id: 'work',
              name: 'Work & Study',
              icon: '💼',
              color: '#3B607A',
              bgColor: '#E6EFF5',
              borderColor: '#D9E4EC',
            },
            {
              id: 'wellness',
              name: 'Wellness',
              icon: '🌱',
              color: '#606362',
              bgColor: '#FBF9F2',
              borderColor: '#E2DDD4',
            },
            {
              id: 'errands',
              name: 'Errands',
              icon: '🛒',
              color: '#C9772B',
              bgColor: '#FDF1E6',
              borderColor: '#F9D0AF',
            },
          ];

          export interface PriorityMeta {
            label: string;
            color: string;
            textColor: string;
            bgColor: string;
            borderColor: string;
          }

          export const PRIORITY_CONFIG: Record<Priority, PriorityMeta> = {
            urgent: {
              label: 'Urgent',
              color: '#D44355',
              textColor: '#D44355',
              bgColor: '#FDECEF',
              borderColor: '#F6BCC5',
            },
            high: {
              label: 'High',
              color: '#C9772B',
              textColor: '#C9772B',
              bgColor: '#FDF1E6',
              borderColor: '#F9D0AF',
            },
            medium: {
              label: 'Medium',
              color: '#3B607A',
              textColor: '#3B607A',
              bgColor: '#E6EFF5',
              borderColor: '#D9E4EC',
            },
            low: {
              label: 'Low',
              color: '#606362',
              textColor: '#606362',
              bgColor: '#F5F4F0',
              borderColor: '#DDD6EC',
            },
          };
          EOF

          # 2. Restore storage.ts
          cat << 'EOF' > src/utils/storage.ts
          import { Task } from '../types/todo';

          const STORAGE_KEY = 'kiras_to_do_list_tasks_v2';

          export const SAMPLE_TASKS: Task[] = [
            {
              id: 'sample-task-1',
              title: 'Style outfit moodboard for weekend meetup',
              description: 'Match silver accessories, oversized knit, and chunky leather boots.',
              completed: false,
              priority: 'high',
              category: 'fits',
              dueDate: new Date().toISOString().split('T')[0],
              dueTime: '15:30',
              createdAt: new Date(Date.now() - 3600000 * 5).toISOString(),
              tags: ['fits', 'aesthetic', 'weekend'],
              subtasks: [
                { id: 'st-1-1', title: 'Pick out chunky silver rings & choker', completed: true },
                { id: 'st-1-2', title: 'Iron pleated charcoal skirt', completed: false },
                { id: 'st-1-3', title: 'Find vintage shoulder bag', completed: false },
              ],
              estimatedMinutes: 45,
            },
            {
              id: 'sample-task-2',
              title: 'Review design critique & layout prototypes',
              description: 'Check typography hierarchy, spacing system, and responsive breakpoints.',
              completed: false,
              priority: 'urgent',
              category: 'work',
              dueDate: new Date().toISOString().split('T')[0],
              dueTime: '18:00',
              createdAt: new Date(Date.now() - 3600000 * 12).toISOString(),
              tags: ['work', 'design', 'urgent'],
              subtasks: [
                { id: 'st-2-1', title: 'Review hero typography', completed: true },
                { id: 'st-2-2', title: 'Check mobile menu drawer animation', completed: true },
                { id: 'st-2-3', title: 'Export Figma icons and clover assets', completed: false },
              ],
              estimatedMinutes: 60,
            },
            {
              id: 'sample-task-3',
              title: 'Morning matcha latte & 15m stretch',
              description: 'Oat milk matcha with lavender syrup and gentle mindful breathing.',
              completed: true,
              completedAt: new Date(Date.now() - 3600000 * 3).toISOString(),
              priority: 'medium',
              category: 'wellness',
              dueDate: new Date().toISOString().split('T')[0],
              dueTime: '09:00',
              createdAt: new Date(Date.now() - 3600000 * 8).toISOString(),
              tags: ['routine', 'wellness'],
              subtasks: [],
              estimatedMinutes: 20,
            },
            {
              id: 'sample-task-4',
              title: 'Pick up dry cleaning & refill film camera roll',
              description: '35mm Portra 400 film and silk blouse from local cleaners.',
              completed: false,
              priority: 'low',
              category: 'errands',
              dueDate: new Date(Date.now() - 86400000).toISOString().split('T')[0],
              dueTime: '14:00',
              createdAt: new Date(Date.now() - 86400000 * 2).toISOString(),
              tags: ['errands', 'camera'],
              subtasks: [
                { id: 'st-4-1', title: 'Locate dry clean receipt ticket', completed: true },
                { id: 'st-4-2', title: 'Stop by camera lab on 4th st', completed: false },
              ],
              estimatedMinutes: 30,
            },
            {
              id: 'sample-task-5',
              title: 'Organize study playlist & journal entries',
              description: 'Curate ambient lo-fi tracklist and reflect on weekly creative goals.',
              completed: false,
              priority: 'medium',
              category: 'personal',
              dueDate: new Date(Date.now() + 86400000).toISOString().split('T')[0],
              dueTime: '20:00',
              createdAt: new Date(Date.now() - 3600000 * 2).toISOString(),
              tags: ['journal', 'personal'],
              subtasks: [],
              estimatedMinutes: 40,
            },
          ];

          export function loadTasksFromStorage(): Task[] {
            if (typeof window === 'undefined') return SAMPLE_TASKS;
            try {
              const raw = localStorage.getItem(STORAGE_KEY);
              if (!raw) return SAMPLE_TASKS;
              const parsed = JSON.parse(raw);
              if (Array.isArray(parsed) && parsed.length > 0) {
                return parsed;
              }
              return SAMPLE_TASKS;
            } catch (err) {
              console.error('Failed to parse tasks from storage:', err);
              return SAMPLE_TASKS;
            }
          }

          export function saveTasksToStorage(tasks: Task[]): void {
            if (typeof window === 'undefined') return;
            try {
              localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
            } catch (err) {
              console.error('Failed to save tasks to storage:', err);
            }
          }

          export function exportTasksToJSON(tasks: Task[]): void {
            const dataStr = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(tasks, null, 2));
            const downloadAnchor = document.createElement('a');
            const dateStr = new Date().toISOString().split('T')[0];
            downloadAnchor.setAttribute('href', dataStr);
            downloadAnchor.setAttribute('download', `kira-tasks-${dateStr}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
          }

          export function importTasksFromJSON(file: File): Promise<Task[]> {
            return new Promise((resolve, reject) => {
              const reader = new FileReader();
              reader.onload = (event) => {
                try {
                  const text = event.target?.result as string;
                  const parsed = JSON.parse(text);
                  if (!Array.isArray(parsed)) {
                    throw new Error('Imported JSON must be an array of tasks.');
                  }
                  resolve(parsed);
                } catch (err) {
                  reject(err);
                }
              };
              reader.onerror = () => reject(new Error('Failed to read file.'));
              reader.readAsText(file);
            });
          }
          EOF

          # 3. Restore UndoToast.tsx
          cat << 'EOF' > src/components/UndoToast.tsx
          import { RotateCcw, X } from 'lucide-react';
          import { CloverIcon } from './CloverIcon';

          interface UndoToastProps {
            message: string;
            onUndo: () => void;
            onDismiss: () => void;
          }

          export function UndoToast({ message, onUndo, onDismiss }: UndoToastProps) {
            return (
              <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 max-w-md w-[calc(100%-2rem)] animate-in fade-in slide-in-from-bottom-4 duration-200">
                <div className="bg-[#2E2741] text-[#FBF9F2] px-4 py-3 rounded-2xl shadow-2xl border border-[#433A5E] flex items-center justify-between gap-3">
                  <div className="flex items-center gap-2.5 min-w-0">
                    <div className="w-6 h-6 rounded-lg bg-[#E7D1DA] text-[#2E2741] flex items-center justify-center shrink-0">
                      <CloverIcon className="w-3.5 h-3.5" />
                    </div>
                    <span className="text-xs font-medium truncate font-mono text-[#EDE9F6]">
                      {message}
                    </span>
                  </div>

                  <div className="flex items-center gap-2 shrink-0">
                    <button
                      type="button"
                      onClick={onUndo}
                      className="px-3 py-1 rounded-xl bg-[#E7D1DA] hover:bg-[#F2E0E7] text-[#2E2741] text-xs font-bold font-mono transition-colors cursor-pointer flex items-center gap-1 shadow-xs"
                    >
                      <RotateCcw className="w-3 h-3 stroke-[2.5]" />
                      <span>Undo</span>
                    </button>

                    <button
                      type="button"
                      onClick={onDismiss}
                      className="p-1 text-[#C8BFD9] hover:text-white transition-colors cursor-pointer rounded-lg hover:bg-[#433A5E]"
                      aria-label="Dismiss"
                    >
                      <X className="w-4 h-4" />
                    </button>
                  </div>
                </div>
              </div>
            );
          }
          EOF

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure npm and install dependencies
        run: |
          echo "legacy-peer-deps=true" > .npmrc
          npm install --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build

      - name: Setup Capacitor and Android Platform
        run: |
          npm install --legacy-peer-deps @capacitor/core @capacitor/android
          npm install --legacy-peer-deps -D @capacitor/cli
          npx cap init "Kira's To-Do-List" "com.kira.todolist" --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kiras-To-Do-List-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
